[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pgnets"
version = "1.0.0"
description = "Planet mass and disc viscosity from protoplanetary-disc gap images with CNNs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shangjia Zhang" }, { name = "Zhaohuan Zhu" }, { name = "Mingon Kang" }]
requires-python = ">=3.9,<3.12"
dependencies = [
    "tensorflow>=2.4,<2.16",   # the saved models are Keras-2 SavedModel / HDF5
    "numpy<2",
    "scipy",
    "astropy",
    "matplotlib",
    "h5py",
]

[project.scripts]
pgnets = "pgnets.cli:main"

[tool.setuptools]
packages = ["pgnets"]
